<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PR Markdown Viewer</title>
<style>
  :root {
    --bg:           #0d1117;
    --bg-sidebar:   #161b22;
    --bg-hover:     #1f2937;
    --bg-active:    #1f2937;
    --bg-code:      #161b22;
    --bg-comment:   #1a2030;
    --bg-cancel:    #21262d;
    --bg-cancel-hv: #30363d;
    --bg-btn-ok:    #238636;
    --bg-btn-ok-hv: #2ea043;
    --bg-error:     #2d1a1a;
    --border:       #30363d;
    --text:         #e6edf3;
    --text-muted:   #8b949e;
    --text-dim:     #c9d1d9;
    --text-code:    #e6edf3;
    --accent:       #58a6ff;
    --tab-active:   #f78166;
    --badge-add-bg: #1a4731; --badge-add-fg: #3fb950;
    --badge-mod-bg: #1a2f4a; --badge-mod-fg: #58a6ff;
    --badge-ren-bg: #2d2a1a; --badge-ren-fg: #e3b341;
    --badge-oth-bg: #2d1a1a; --badge-oth-fg: #f85149;
    --marker-fg:    #3fb950;
    --err-fg:       #f85149;
    --ok-fg:        #3fb950;
  }

  [data-theme="light"] {
    --bg:           #ffffff;
    --bg-sidebar:   #f6f8fa;
    --bg-hover:     #eaeef2;
    --bg-active:    #eaeef2;
    --bg-code:      #f6f8fa;
    --bg-comment:   #dbeafe;
    --bg-cancel:    #f3f4f6;
    --bg-cancel-hv: #e5e7eb;
    --bg-btn-ok:    #1a7f37;
    --bg-btn-ok-hv: #218240;
    --bg-error:     #fef2f2;
    --border:       #d0d7de;
    --text:         #1f2328;
    --text-muted:   #57606a;
    --text-dim:     #424a53;
    --text-code:    #1f2328;
    --accent:       #0969da;
    --tab-active:   #fd8c73;
    --badge-add-bg: #dafbe1; --badge-add-fg: #116329;
    --badge-mod-bg: #ddf4ff; --badge-mod-fg: #0969da;
    --badge-ren-bg: #fdf8e1; --badge-ren-fg: #7d4e00;
    --badge-oth-bg: #fef2f2; --badge-oth-fg: #82071e;
    --marker-fg:    #1a7f37;
    --err-fg:       #cf222e;
    --ok-fg:        #1a7f37;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }
  #sidebar h2 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 12px 8px;
  }
  .file-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
    line-height: 1.4;
    word-break: break-all;
  }
  .file-item:hover { background: var(--bg-hover); }
  .file-item.active {
    background: var(--bg-active);
    border-left-color: var(--accent);
  }
  .file-name { flex: 1; font-size: 12px; color: var(--text); }
  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .status-added    { background: var(--badge-add-bg); color: var(--badge-add-fg); }
  .status-modified { background: var(--badge-mod-bg); color: var(--badge-mod-fg); }
  .status-renamed  { background: var(--badge-ren-bg); color: var(--badge-ren-fg); }
  .status-other    { background: var(--badge-oth-bg); color: var(--badge-oth-fg); }
  .diff-counts { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }

  /* ── Main panel ── */
  #main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #tabs {
    display: flex;
    align-items: center;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg-sidebar);
    padding: 0 16px;
    flex-shrink: 0;
  }
  .tab {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--tab-active); }
  .tab:hover:not(.active) { color: var(--text-dim); }

  /* ── Toolbar buttons (theme toggle, refresh, PR link) ── */
  #toolbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .toolbar-btn {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    line-height: 1.4;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .toolbar-btn:hover { color: var(--text); border-color: var(--accent); }
  .toolbar-btn.spinning svg { animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  #empty-state {
    color: var(--text-muted);
    text-align: center;
    margin-top: 80px;
    font-size: 15px;
  }

  /* ── Rendered markdown ── */
  .markdown-body {
    max-width: 780px;
    line-height: 1.6;
    color: var(--text);
  }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 {
    margin: 1.2em 0 .4em;
    font-weight: 600;
    line-height: 1.25;
    color: var(--text);
  }
  .markdown-body h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .markdown-body p { margin: .8em 0; }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body code {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: .875em;
  }
  .markdown-body pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    margin: 1em 0;
  }
  .markdown-body pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: .875em;
    color: var(--text-code);
  }
  .markdown-body ul, .markdown-body ol { padding-left: 2em; margin: .8em 0; }
  .markdown-body li { margin: .3em 0; }
  .markdown-body blockquote {
    border-left: 4px solid var(--border);
    color: var(--text-muted);
    margin: .8em 0;
    padding: 0 1em;
  }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  .markdown-body th, .markdown-body td {
    border: 1px solid var(--border);
    padding: 6px 12px;
    text-align: left;
  }
  .markdown-body th { background: var(--bg-code); font-weight: 600; }
  .markdown-body img { max-width: 100%; }
  .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }

  /* ── Source view ── */
  #source-table {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    border-collapse: collapse;
    width: 100%;
    max-width: 900px;
  }
  .src-line { display: contents; }
  .src-ln {
    user-select: none;
    color: var(--text-muted);
    text-align: right;
    padding: 0 12px 0 4px;
    width: 1%;
    white-space: nowrap;
    vertical-align: top;
  }
  .src-marker {
    width: 20px;
    text-align: center;
    color: var(--marker-fg);
    vertical-align: top;
    padding: 0 4px;
    cursor: pointer;
  }
  .src-marker:hover { color: var(--accent); }
  .src-code {
    white-space: pre-wrap;
    word-break: break-all;
    padding: 0 8px;
    line-height: 1.5;
    vertical-align: top;
  }
  tr.commentable .src-code { cursor: pointer; }
  tr.commentable:hover { background: var(--bg-comment); }
  tr.commentable:hover .src-marker::before { content: "+"; }

  /* ── Inline comment form ── */
  .comment-row td {
    padding: 8px 8px 8px 52px;
    background: var(--bg-comment);
  }
  .comment-form textarea {
    width: 100%;
    min-height: 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px;
    resize: vertical;
  }
  .comment-form textarea:focus { outline: none; border-color: var(--accent); }
  .comment-actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    padding: 5px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .btn-primary { background: var(--bg-btn-ok); color: #fff; }
  .btn-primary:hover { background: var(--bg-btn-ok-hv); }
  .btn-cancel { background: var(--bg-cancel); color: var(--text); border: 1px solid var(--border); }
  .btn-cancel:hover { background: var(--bg-cancel-hv); }
  .comment-msg { font-size: 12px; margin-top: 6px; }
  .comment-msg.ok { color: var(--ok-fg); }
  .comment-msg.err { color: var(--err-fg); }

  /* ── Rendered view: commentable blocks ── */
  .md-commentable {
    cursor: pointer;
    position: relative;
    border-radius: 4px;
    transition: background 0.1s;
  }
  .md-commentable:hover {
    background: rgba(88, 166, 255, 0.07);
    outline: 1px solid rgba(88, 166, 255, 0.25);
  }
  .md-commentable:hover::after {
    content: "+";
    position: absolute;
    right: -22px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .md-comment-form-wrap {
    margin: 8px 0 12px;
  }
  .md-comment-form-wrap .comment-form textarea {
    width: 100%;
    min-height: 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px;
    resize: vertical;
  }
  .md-comment-form-wrap .comment-form textarea:focus { outline: none; border-color: var(--accent); }

  /* ── Review threads ── */
  .thread-wrap {
    margin: 8px 0 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .thread-wrap.resolved {
    opacity: 0.55;
  }
  .thread-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }
  .thread-resolved-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--badge-mod-bg);
    color: var(--badge-mod-fg);
  }
  .thread-comment {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .thread-comment:last-child { border-bottom: none; }
  .thread-comment-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .thread-comment-meta strong { color: var(--accent); font-weight: 600; }
  .thread-comment-body {
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .thread-actions {
    display: flex;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-sidebar);
    border-top: 1px solid var(--border);
  }
  .btn-sm {
    padding: 3px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-cancel);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-sm:hover { background: var(--bg-cancel-hv); }
  .btn-sm.resolve { border-color: var(--bg-btn-ok); color: var(--ok-fg); }
  .btn-sm.resolve:hover { background: var(--bg-btn-ok); color: #fff; }
  .thread-reply-form {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-comment);
  }
  .thread-reply-form textarea {
    width: 100%;
    min-height: 60px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    resize: vertical;
  }
  .thread-reply-form textarea:focus { outline: none; border-color: var(--accent); }
  .thread-reply-actions { display: flex; gap: 8px; margin-top: 6px; }

  /* source view: thread below a line */
  .src-thread-row td {
    padding: 0;
    background: var(--bg-comment);
  }
  .src-thread-row .thread-wrap { margin: 0; border-radius: 0; border-left: 3px solid var(--accent); border-right: none; border-top: none; }

  /* ── Loading / error ── */
  .loading { color: var(--text-muted); font-style: italic; padding: 20px 0; }
  .error-msg { color: var(--err-fg); padding: 12px; background: var(--bg-error); border-radius: 6px; }
</style>
</head>
<body>

<nav id="sidebar">
  <h2>Changed Files</h2>
  <div id="file-list"><span class="loading">Loading…</span></div>
</nav>

<section id="main">
  <div id="tabs">
    <button class="tab active" data-tab="rendered">Rendered</button>
    <button class="tab" data-tab="source">Source</button>
    <div id="toolbar-right">
      <button id="refresh-btn" class="toolbar-btn" title="Refresh (clear cache)">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
        Refresh
      </button>
      <a id="pr-link" class="toolbar-btn" href="#" target="_blank" rel="noopener" title="Open PR on GitHub">↗ PR</a>
      <button id="theme-toggle" class="toolbar-btn" title="Toggle light/dark mode">☀ Light</button>
    </div>
  </div>
  <div id="content">
    <div id="empty-state">Select a file from the sidebar.</div>
  </div>
</section>

<script>
let currentPath = null;
let currentTab = 'rendered';
// threads cache keyed by path
const threadCache = {};
// content caches keyed by path — avoids re-fetching on tab/file switch
const renderedCache = {};
const sourceCache = {};

// ── Theme ──
const root = document.documentElement;
const toggleBtn = document.getElementById('theme-toggle');

function applyTheme(theme) {
  root.dataset.theme = theme;
  toggleBtn.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
}

const saved = localStorage.getItem('theme');
applyTheme(saved === 'light' ? 'light' : 'dark');

toggleBtn.addEventListener('click', () => {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
});

// ── Refresh ──
const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', () => {
  // clear all caches
  for (const k in threadCache) delete threadCache[k];
  for (const k in renderedCache) delete renderedCache[k];
  for (const k in sourceCache) delete sourceCache[k];
  refreshBtn.classList.add('spinning');
  const done = () => refreshBtn.classList.remove('spinning');
  if (currentPath) {
    loadFile(currentPath).finally(done);
  } else {
    loadSidebar().finally(done);
  }
});

// ── PR link ──
const prLink = document.getElementById('pr-link');
fetch('/api/info').then(r => r.json()).then(({ url }) => {
  prLink.href = url;
}).catch(() => { prLink.style.display = 'none'; });

// ── Tab switching ──
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (currentPath) loadFile(currentPath);
  });
});

// ── Sidebar ──
async function loadSidebar() {
  const res = await fetch('/api/files');
  const files = await res.json();
  const list = document.getElementById('file-list');
  list.innerHTML = '';
  files.forEach(f => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.path = f.path;

    const statusClass = {
      added: 'status-added',
      modified: 'status-modified',
      renamed: 'status-renamed',
    }[f.status] || 'status-other';

    item.innerHTML = `
      <span class="file-name">${esc(f.path)}</span>
      <span class="status-badge ${statusClass}">${esc(f.status)}</span>
      <span class="diff-counts">+${f.additions} -${f.deletions}</span>
    `;
    item.addEventListener('click', () => selectFile(f.path, item));
    list.appendChild(item);
  });
}

function selectFile(path, itemEl) {
  document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
  itemEl.classList.add('active');
  currentPath = path;
  loadFile(path);
}

// ── Threads ──
async function getThreads(path) {
  if (threadCache[path]) return threadCache[path];
  const res = await fetch('/api/threads');
  if (!res.ok) return [];
  const all = await res.json();
  // group by path so each loadFile call can filter cheaply
  for (const t of (all || [])) {
    if (!threadCache[t.path]) threadCache[t.path] = [];
    threadCache[t.path].push(t);
  }
  return threadCache[path] || [];
}

function invalidateThreads() {
  for (const k in threadCache) delete threadCache[k];
}

function buildThreadEl(thread, onAction) {
  const wrap = document.createElement('div');
  wrap.className = 'thread-wrap' + (thread.resolved ? ' resolved' : '');
  wrap.dataset.nodeId = thread.nodeId;

  const header = document.createElement('div');
  header.className = 'thread-header';
  header.innerHTML = `<span>Thread · line ${thread.line}</span>`;
  if (thread.resolved) {
    const badge = document.createElement('span');
    badge.className = 'thread-resolved-badge';
    badge.textContent = 'Resolved';
    header.appendChild(badge);
  }
  wrap.appendChild(header);

  for (const c of (thread.comments || [])) {
    const div = document.createElement('div');
    div.className = 'thread-comment';
    const date = new Date(c.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    div.innerHTML = `
      <div class="thread-comment-meta"><strong>${esc(c.author)}</strong> &mdash; ${esc(date)}</div>
      <div class="thread-comment-body">${esc(c.body)}</div>
    `;
    wrap.appendChild(div);
  }

  // action bar
  const actions = document.createElement('div');
  actions.className = 'thread-actions';

  const replyBtn = document.createElement('button');
  replyBtn.className = 'btn-sm';
  replyBtn.textContent = 'Reply';
  actions.appendChild(replyBtn);

  if (!thread.resolved) {
    const resolveBtn = document.createElement('button');
    resolveBtn.className = 'btn-sm resolve';
    resolveBtn.textContent = 'Resolve conversation';
    resolveBtn.addEventListener('click', async () => {
      resolveBtn.disabled = true;
      resolveBtn.textContent = 'Resolving…';
      try {
        const res = await fetch('/api/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nodeId: thread.nodeId }),
        });
        if (!res.ok) throw new Error(await res.text());
        thread.resolved = true;
        invalidateThreads();
        onAction();
      } catch (e) {
        resolveBtn.disabled = false;
        resolveBtn.textContent = 'Resolve conversation';
        alert('Error: ' + e.message);
      }
    });
    actions.appendChild(resolveBtn);
  }
  wrap.appendChild(actions);

  // reply form (hidden until Reply clicked)
  const replyForm = document.createElement('div');
  replyForm.className = 'thread-reply-form';
  replyForm.style.display = 'none';

  const lastComment = thread.comments?.[thread.comments.length - 1];
  const ta = document.createElement('textarea');
  ta.placeholder = 'Reply to this thread…';
  const replyActions = document.createElement('div');
  replyActions.className = 'thread-reply-actions';

  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn btn-primary';
  submitBtn.textContent = 'Reply';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-cancel';
  cancelBtn.textContent = 'Cancel';

  const msg = document.createElement('div');
  msg.className = 'comment-msg';

  cancelBtn.addEventListener('click', () => { replyForm.style.display = 'none'; ta.value = ''; });

  submitBtn.addEventListener('click', async () => {
    const body = ta.value.trim();
    if (!body || !lastComment) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Posting…';
    msg.textContent = '';
    try {
      const res = await fetch('/api/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ commentId: lastComment.id, body }),
      });
      if (!res.ok) throw new Error(await res.text());
      msg.className = 'comment-msg ok';
      msg.textContent = 'Reply posted!';
      invalidateThreads();
      setTimeout(onAction, 1000);
    } catch (e) {
      msg.className = 'comment-msg err';
      msg.textContent = e.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reply';
    }
  });

  replyBtn.addEventListener('click', () => {
    replyForm.style.display = replyForm.style.display === 'none' ? '' : 'none';
    if (replyForm.style.display !== 'none') ta.focus();
  });

  replyActions.append(submitBtn, cancelBtn);
  replyForm.append(ta, replyActions, msg);
  wrap.appendChild(replyForm);

  return wrap;
}

// ── Content loading ──
function loadFile(path) {
  return currentTab === 'rendered' ? loadRendered(path) : loadSource(path);
}

async function loadRendered(path) {
  const content = document.getElementById('content');
  content.innerHTML = '<span class="loading">Rendering…</span>';
  try {
    let rendered = renderedCache[path];
    if (!rendered) {
      const res = await fetch('/api/file/rendered?path=' + encodeURIComponent(path));
      if (!res.ok) throw new Error(await res.text());
      rendered = await res.json();
      renderedCache[path] = rendered;
    }
    const threads = await getThreads(path);
    const { html, commentableLines } = rendered;
    content.innerHTML = '<div class="markdown-body"></div>';
    const body = content.querySelector('.markdown-body');
    body.innerHTML = html;
    attachRenderedComments(body, commentableLines, path);
    injectRenderedThreads(body, threads, path);
  } catch (e) {
    content.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`;
  }
}

function attachRenderedComments(body, _commentableLines, path) {
  const anchors = body.querySelectorAll('a[id^="user-content-md-src-"]');
  anchors.forEach(anchor => {
    const lineN = parseInt(anchor.id.replace('user-content-md-src-', ''), 10);
    if (!lineN) return;

    const block = anchor.closest('p, li, h1, h2, h3, h4, h5, h6, blockquote, td, dt, dd') || anchor.parentElement;
    if (!block || block._mdCommentWired) return;
    block._mdCommentWired = true;
    block.classList.add('md-commentable');

    block.addEventListener('click', () => {
      if (block.nextElementSibling?.classList.contains('md-comment-form-wrap')) return;
      const wrap = buildRenderedCommentForm(path, lineN, () => wrap.remove());
      block.after(wrap);
      wrap.querySelector('textarea').focus();
    });
  });
}

// Inject existing threads into the rendered markdown view.
// Each thread is anchored to the block that contains the anchor for its line.
function injectRenderedThreads(body, threads, path) {
  if (!threads || !threads.length) return;
  // Build a map: line -> anchor element
  const anchorMap = {};
  body.querySelectorAll('a[id^="user-content-md-src-"]').forEach(a => {
    const n = parseInt(a.id.replace('user-content-md-src-', ''), 10);
    if (n) anchorMap[n] = a;
  });

  for (const thread of threads) {
    const anchor = anchorMap[thread.line];
    if (!anchor) continue;
    const block = anchor.closest('p, li, h1, h2, h3, h4, h5, h6, blockquote, td, dt, dd') || anchor.parentElement;
    if (!block) continue;

    const reload = () => { invalidateThreads(); loadRendered(path); };
    const threadEl = buildThreadEl(thread, reload);
    block.after(threadEl);
  }
}

async function loadSource(path) {
  const content = document.getElementById('content');
  content.innerHTML = '<span class="loading">Loading source…</span>';
  try {
    let source = sourceCache[path];
    if (!source) {
      const res = await fetch('/api/file/source?path=' + encodeURIComponent(path));
      if (!res.ok) throw new Error(await res.text());
      source = await res.json();
      sourceCache[path] = source;
    }
    const threads = await getThreads(path);
    renderSourceTable(source.lines, path, content, threads);
  } catch (e) {
    content.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`;
  }
}

function renderSourceTable(lines, path, container, threads) {
  const table = document.createElement('table');
  table.id = 'source-table';

  // build line -> threads map
  const threadsByLine = {};
  for (const t of (threads || [])) {
    if (!threadsByLine[t.line]) threadsByLine[t.line] = [];
    threadsByLine[t.line].push(t);
  }

  lines.forEach(({ n, text, commentable }) => {
    const tr = document.createElement('tr');
    if (commentable) tr.classList.add('commentable');

    const tdLn = document.createElement('td');
    tdLn.className = 'src-ln';
    tdLn.textContent = n;

    const tdMark = document.createElement('td');
    tdMark.className = 'src-marker';

    const tdCode = document.createElement('td');
    tdCode.className = 'src-code';
    tdCode.textContent = text;

    tr.append(tdLn, tdMark, tdCode);
    table.appendChild(tr);

    if (commentable) {
      const openComment = () => {
        if (tr.nextSibling && tr.nextSibling.classList?.contains('comment-row')) return;
        const formRow = buildCommentForm(path, n, () => formRow.remove());
        // insert after any thread rows already present
        let insertAfter = tr;
        while (insertAfter.nextSibling?.classList?.contains('src-thread-row')) {
          insertAfter = insertAfter.nextSibling;
        }
        insertAfter.after(formRow);
        formRow.querySelector('textarea').focus();
      };
      tdMark.addEventListener('click', openComment);
      tdCode.addEventListener('click', openComment);
    }

    // inject existing threads for this line
    for (const thread of (threadsByLine[n] || [])) {
      const threadRow = document.createElement('tr');
      threadRow.className = 'src-thread-row';
      const threadTd = document.createElement('td');
      threadTd.colSpan = 3;
      const reload = () => { invalidateThreads(); loadSource(path); };
      threadTd.appendChild(buildThreadEl(thread, reload));
      threadRow.appendChild(threadTd);
      table.appendChild(threadRow);
    }
  });

  container.innerHTML = '';
  container.appendChild(table);
}

function buildCommentForm(path, line, onClose) {
  const tr = document.createElement('tr');
  tr.className = 'comment-row';
  const td = document.createElement('td');
  td.colSpan = 3;

  const form = document.createElement('div');
  form.className = 'comment-form';

  const ta = document.createElement('textarea');
  ta.placeholder = `Leave a comment on line ${line}…`;

  const actions = document.createElement('div');
  actions.className = 'comment-actions';

  const submit = document.createElement('button');
  submit.className = 'btn btn-primary';
  submit.textContent = 'Submit';

  const cancel = document.createElement('button');
  cancel.className = 'btn btn-cancel';
  cancel.textContent = 'Cancel';

  const msg = document.createElement('div');
  msg.className = 'comment-msg';

  cancel.addEventListener('click', onClose);

  submit.addEventListener('click', async () => {
    const body = ta.value.trim();
    if (!body) return;
    submit.disabled = true;
    submit.textContent = 'Posting…';
    msg.className = 'comment-msg';
    msg.textContent = '';
    try {
      const res = await fetch('/api/comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, line, body }),
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(errText);
      }
      msg.className = 'comment-msg ok';
      msg.textContent = 'Comment posted!';
      setTimeout(onClose, 1200);
    } catch (e) {
      msg.className = 'comment-msg err';
      msg.textContent = e.message;
      submit.disabled = false;
      submit.textContent = 'Submit';
    }
  });

  actions.append(submit, cancel);
  form.append(ta, actions, msg);
  td.appendChild(form);
  tr.appendChild(td);
  return tr;
}

function buildRenderedCommentForm(path, line, onClose) {
  const wrap = document.createElement('div');
  wrap.className = 'md-comment-form-wrap';

  const form = document.createElement('div');
  form.className = 'comment-form';

  const ta = document.createElement('textarea');
  ta.placeholder = `Leave a comment on line ${line}…`;

  const actions = document.createElement('div');
  actions.className = 'comment-actions';

  const submit = document.createElement('button');
  submit.className = 'btn btn-primary';
  submit.textContent = 'Submit';

  const cancel = document.createElement('button');
  cancel.className = 'btn btn-cancel';
  cancel.textContent = 'Cancel';

  const msg = document.createElement('div');
  msg.className = 'comment-msg';

  cancel.addEventListener('click', onClose);

  submit.addEventListener('click', async () => {
    const body = ta.value.trim();
    if (!body) return;
    submit.disabled = true;
    submit.textContent = 'Posting…';
    msg.className = 'comment-msg';
    msg.textContent = '';
    try {
      const res = await fetch('/api/comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, line, body }),
      });
      if (!res.ok) throw new Error(await res.text());
      msg.className = 'comment-msg ok';
      msg.textContent = 'Comment posted!';
      setTimeout(onClose, 1200);
    } catch (e) {
      msg.className = 'comment-msg err';
      msg.textContent = e.message;
      submit.disabled = false;
      submit.textContent = 'Submit';
    }
  });

  actions.append(submit, cancel);
  form.append(ta, actions, msg);
  wrap.appendChild(form);
  return wrap;
}

// ── Utils ──
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
